name: release

# Tag a commit and the binaries appear on the release page. They exist so that
# installing does not start with "first get a Go toolchain": deploy/install.sh
# downloads one and checks it against SHA256SUMS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/version.sh counts commits, so it needs all of them.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The number is worked out from the history, not taken from the tag: a
      # tag that says something else would publish binaries that disagree with
      # their own release page.
      - name: The tag names the version
        if: github.ref_type == 'tag'
        run: |
          want="v$(tools/version.sh)"
          [ "$GITHUB_REF_NAME" = "$want" ] || {
            echo "tag $GITHUB_REF_NAME, but this commit builds $want"; exit 1; }
      # A release nobody tested is worse than no release.
      - run: make lint test
      - run: make release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "not a tag ($GITHUB_REF_TYPE $tag) — artifacts built, nothing published"
            exit 0
          fi
          gh release create "$tag" dist/* --generate-notes --title "$tag"
