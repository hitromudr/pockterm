name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `make check` includes `format`, which rewrites files instead of
      # failing on unformatted code; CI must only verify, not mutate.
      # JS tests run in the separate `test-js` target and are included explicitly.
      - run: make lint test test-js
