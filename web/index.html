<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- The pane's font. Preloaded because the stylesheet only asks for it once
       the first row is being drawn, and until it arrives the pane is drawn in
       whatever the machine has — one screen in three typefaces is what the
       embedded font is here to stop. Bold is left to the stylesheet: it is the
       rarer half of a pane. -->
  <link rel="preload" href="fonts/pockterm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>pockterm</title>
</head>
<body>
  <!-- The session list is a drawer over the terminal, not a screen of its own.
       Switching screens threw the terminal away while you looked at the list —
       and looking at the list is something you do to check what else is running,
       not to leave what you are in. -->
  <div id="drawer-scrim" hidden></div>
  <div id="screen-sessions">
    <header class="bar">
      <!-- Where ☰ is on the terminal's header, so the same spot opens and
           closes it. A chevron rather than a cross: the drawer slides back, it
           does not go away, and ✕ next to the title read like closing pockterm
           itself. -->
      <button id="drawer-close" title="Slide the list back">&#10094;</button>
      <span class="title">pockterm</span>
      <!-- The folders of the projects root, as somewhere to start a session.
           A second view of the drawer rather than a section under the list:
           two scrolling lists on a phone leave neither of them a full thumb's
           worth of room, and the list you came for is the sessions. -->
      <button id="folders" title="Projects">&#128193;</button>
      <!-- With no session left there is nowhere to type the command that
           would make one: this is the way back in. -->
      <button id="new" title="New session">&plus;</button>
      <button id="refresh" title="Refresh">&#8635;</button>
    </header>
    <!-- The install offer, on the screen a scanned link lands on.
         It used to be only the button at the bottom of this drawer's settings
         (#install below): the browser hands over its prompt, the button appears
         two taps deep, and a first visit closes the tab without ever seeing it
         — reported as "по QR ничего не установилось". In the flow rather than
         over it: this screen is a list, and a bar floating over a list covers
         the row somebody is reaching for. -->
    <div id="install-bar" hidden>
      <span id="install-text"></span>
      <button id="install-do" type="button" hidden>Установить</button>
      <button id="install-close" type="button" title="Позже">&#10005;</button>
    </div>
    <div id="new-menu" hidden>
      <!-- Which folder the preset will start in. Written by the page: the same
           four buttons serve the plain + (the projects root) and a folder that
           was just tapped, and a menu that did not say which would start a
           session somewhere the owner did not mean. -->
      <span id="new-where" hidden></span>
      <!-- The buttons themselves are written by the page from the host's list:
           the four defaults are entries in it, editable and removable like any
           other, so a menu spelled out here would be a second answer to what
           exists. See renderButtons in js/app.js. -->
    </div>
    <div id="rename-box" hidden>
      <input id="rename-input" type="text" autocomplete="off" placeholder="new name">
      <button id="rename-save">Save</button>
      <button id="rename-cancel">&#10005;</button>
    </div>
    <ul id="session-list"></ul>
    <!-- The other view of the drawer: the folders of the projects root, the
         root itself first. Tapping one opens the presets above for it, and the
         session it starts is named after the folder. -->
    <ul id="folder-list" hidden></ul>
    <div id="empty" hidden>
      <p>No active tmux sessions.</p>
      <p>Start one on the server, then tap refresh.</p>
    </div>
    <!-- Settings, at the bottom of the drawer.
         They used to sit behind ⋯ over the terminal, which is the surface you
         work on: a lever you touch once a month was taking permanent space from
         the one place where every tap matters. The drawer is where you go to
         decide something rather than to do something, and it had room to spare.
         Moved, not copied — two places holding one lever is how they drift. -->
    <div id="settings" hidden>
      <div class="row">
        <button id="font-dec" title="Smaller text">A&minus;</button>
        <button id="font-inc" title="Bigger text">A+</button>
        <!-- Three states, walked by tapping: this page, this page plus Telegram,
             neither. The label and the title are written by renderBell — what is
             here is only what the first paint shows before the socket says what
             the host is actually set to. -->
        <button id="bell" title="Nothing is notified. Tap to notify this page">&#128276; Notify</button>
      </div>
      <div class="row">
        <!-- Which keyboard the app is asked for. `?ime=` was meant to make the
             next attempt cost a reload rather than an APK release, but the
             Android client loads a fixed URL and has no address bar to type it
             into — so the switch lives here. -->
        <button id="ime" title="Which keyboard the app gives the terminal">&#9000; text</button>
        <!-- Whether the page holds the picture under the finger between whole
             lines, or lets the screen move only in whole ones. A lever rather
             than a decision: it is a question about feel, and the only device
             that can answer it is the owner's. -->
        <button id="smooth" title="Follow the finger between whole lines">&#12336; smooth</button>
        <!-- Records what the keyboard does to the input field, into the server's
             journal. Off by default: one line per keystroke, and the second tap
             records the typed text itself. -->
        <button id="input-diag" title="Record what the keyboard does">&#128269; Input log</button>
      </div>
      <!-- The session buttons: the four the page starts with and whatever the
           owner added beside them, one list. A label to tap and a command to
           run — and for a default, no command at all: its own name is the make
           target, and the Makefile decides what that does. -->
      <div id="buttons-box">
        <div class="head">Кнопки сессий</div>
        <ul id="custom-list"></ul>
        <div class="add">
          <!-- The mark, picked from a grid rather than typed into the label. It sits
               with the label because that is the pair a button is named by; the
               command is a line of its own below. -->
          <button id="custom-mark" type="button" title="Знак кнопки">&#11088;</button>
          <input id="custom-label" type="text" autocomplete="off" placeholder="название">
          <!-- Under the button that opens it, not at the end of the panel: a grid of
               forty glyphs is a lot to связать with a 44px button a screen away.
               Written by the page from MARKS in js/kinds.js — one vocabulary, shared
               with the strip and the drawer. -->
          <div id="mark-grid" hidden></div>
          <input id="custom-cmd" type="text" autocomplete="off" spellcheck="false" placeholder="команда (qwen) или make цель">
          <button id="custom-add">Добавить</button>
        </div>
        <!-- Two taps, like every other removal here: it puts back what the four
             were and leaves the owner's own buttons alone. -->
        <button id="custom-reset" type="button" title="Вернуть четыре кнопки по умолчанию">&#8635; Сбросить к умолчанию</button>
        <p id="custom-note" hidden></p>
      </div>
      <div class="row">
        <!-- "Did it update?" should be answerable without reinstalling. -->
        <span id="versions"></span>
        <!-- Unhidden only when the browser offers the install; see app.js. -->
        <button id="install" title="Install as an app" hidden>&#11015; Install</button>
      </div>
    </div>
    <!-- Pinned under the list, so opening the drawer never costs the settings a
         scroll and the settings never cost the list one. -->
    <button id="settings-toggle" title="Settings">&#9881; Настройки</button>
  </div>

  <!-- Screen 2: the attached terminal. -->
  <div id="screen-term" hidden>
    <!-- Navigation only. Everything you press while working lives at the
         bottom of the screen, within reach of a thumb; the top edge of a
         6-inch phone is not. -->
    <header class="bar">
      <button id="back" title="All sessions">&#9776;</button>
      <div id="tabs"></div>
      <!-- Starting a session without leaving the one you are in: the tab strip
           is the session list on this screen, so the same plus belongs at the
           end of it. -->
      <button id="new-term" title="New session">&plus;</button>
    </header>
    <!-- What the mark on a tab means, for the device that has no hover. Held
         under the tab rather than over it: the strip is the top edge of the
         screen, and there is nothing above it to hang a plate on. -->
    <div id="kind-help" hidden></div>
    <!-- The buttons, again. The same list as on the drawer screen and the same
         handler; a popup rather than a row, because the header has no space for
         four buttons on a phone. -->
    <div id="menu-scrim" hidden></div>
    <div id="new-menu-term" hidden></div>
    <div id="status" hidden></div>
    <!-- CI installs a build the moment it arrives, so the unit restarts under
         whoever is looking and the page reconnects still running the previous
         assets. It cannot tell that by itself — its own code is the old code —
         so the server names the version it serves and this appears. A button
         rather than an automatic reload: a page that reloaded itself would
         throw away whatever was half-typed in the composer. -->
    <div id="update-bar" hidden>
      <span id="update-text"></span>
      <button id="update-now" type="button">Обновить</button>
    </div>
    <div id="toast" hidden></div>
    <div id="term">
      <!-- Selection mode lays a frozen copy of the screen over the live
           terminal; see #snapshot in css/app.css. -->
      <pre id="snapshot" hidden></pre>
      <!-- Buttons for a detected interactive prompt (a Claude permission
           prompt, a question with a description under each answer).

           Inside the terminal and over it, never beside it. In the screen's own
           column it took nine rows of a 35-row pane away from tmux, and the menu
           it is detected from is what got shorter: the top of the menu scrolled
           out of the grid, nothing was detected, the row went away, the pane grew
           back — and round again, reported from the phone as the buttons
           blinking. A row whose own presence decides whether it should be there
           cannot be in the flow. -->
      <div id="answers" hidden></div>
      <!-- The control keys themselves, opened by Ctrl on the bar.
           A modifier was the first answer and this phone cannot give one: Gboard
           composes, so xterm is handed a whole word when the composition closes,
           and there is no keystroke to modify. Measured 2026-08-12 —
           `compositionend` with len 3, 5, 7, 8, 9. The pad needs no keystroke at
           all. Over the terminal and never beside it, like the answer row: a
           panel in the flow shortens the pane and tmux redraws under the page. -->
      <div id="ctrlpad" hidden>
        <button data-ctrl="a">^A</button>
        <button data-ctrl="e">^E</button>
        <button data-ctrl="k">^K</button>
        <button data-ctrl="u">^U</button>
        <button data-ctrl="w">^W</button>
        <button data-ctrl="r">^R</button>
        <button data-ctrl="l">^L</button>
        <button data-ctrl="d">^D</button>
        <button data-ctrl="z">^Z</button>
        <button data-ctrl="p">^P</button>
      </div>
      <!-- The console pad: whole commands where the pad above sends bytes.
           Its mirror, and deliberately so — the bar at the bottom of the screen
           carries what no keyboard has, and this carries what a thumb should not
           have to spell out on one. Same placement rule as #ctrlpad and #answers,
           and for the same reason: absolute inside #term, opaque, over the rows it
           repeats, because a panel in the flow shortens the pane and tmux redraws
           under the page.

           At the top of the pane rather than the bottom, which is the whole of why
           it can be a pad of commands at all: a shell writes at the bottom — the
           prompt, the command, its answer — so a pad over the last rows would cover
           the very thing every button here is pressed to see.

           **Every button is the same size, and the count is a number that divides.**
           That is the third layout and the first one that holds. Cells of equal
           width with a `span 2` here and a `span 3` there fit a phone and fall apart
           on a laptop, where the columns are 400px wide and the spans read as three
           different kinds of button — reported off a desktop screen, and correctly.
           So: no spans, one cell each, a label that wraps to a second line when the
           command is long, and a fixed height so every cell is identical in both
           directions. **Twenty-four cells** — twenty-three commands and the ▴ — and
           every column count the stylesheet ever uses is a divisor of twenty-four:
           3 on a phone, 6, 8, 12 as the screen grows. The grid is therefore always
           exactly full, at every width.

           The rule that decides the list is still that **the label is the command**:
           what goes out is what is written on the button, so `|cat` where a pager
           would otherwise open — systemctl and journalctl hand their output to
           `less` whenever it does not fit a screen, and this pad has no `q`. The two
           that page by nature and cannot be talked out of it (`git log`, `git diff`)
           are absent for the same reason. A browser test asserts every label against
           its own `data-cmd`, that none overflows the cell it is drawn in, and that
           all twenty-four cells are the same size.

           `clear` and `reset` are both here on purpose. They look like one button
           twice and are not: `clear` scrolls the screen away and tmux keeps it in
           the history, `reset` puts a terminal that has been left in some mode by a
           killed program back to itself.

           **Three buttons are this host's, not Linux's.** `vcgencmd` is Raspberry Pi
           firmware: temperature, throttling and the V3D clock come from there, and
           on the fleet's x86 machines those three answer "command not found". They
           are here because this pad's host is the RPi5; the portable reading of the
           same fact is a line of noise (`/sys/class/thermal`, in millidegrees) or
           twelve lines of it (`sensors`) where these are a line of answer.

           The order is a walk rather than a grid: where the rows break depends on how
           wide the screen is, so what is next to what cannot be arranged — what can
           is the sequence. Moving about, then the disks and memory, then the machine
           itself, its heat, its network, its services, its processes, and git. -->
      <div id="cmdpad" hidden>
        <button data-cmd="clear">clear</button>
        <button data-cmd="reset">reset</button>
        <button data-cmd="pwd">pwd</button>
        <button data-cmd="ls -al --color">ls -al --color</button>
        <button data-cmd="cd ..">cd ..</button>
        <button data-cmd="cd ~">cd ~</button>
        <button data-cmd="df -h">df -h</button>
        <button data-cmd="free -h">free -h</button>
        <button data-cmd="uptime">uptime</button>
        <button data-cmd="uname -a">uname -a</button>
        <button data-cmd="vcgencmd measure_temp">vcgencmd measure_temp</button>
        <button data-cmd="vcgencmd get_throttled">vcgencmd get_throttled</button>
        <button data-cmd="vcgencmd measure_clock v3d">vcgencmd measure_clock v3d</button>
        <button data-cmd="ip -br a|grep '^[ew]'">ip -br a|grep '^[ew]'</button>
        <button data-cmd="curl eth0.me">curl eth0.me</button>
        <button data-cmd="netstat -tupln">netstat -tupln</button>
        <button data-cmd="systemctl --failed">systemctl --failed</button>
        <button data-cmd="systemctl -t service|cat">systemctl -t service|cat</button>
        <button data-cmd="journalctl -p err -n20|cat">journalctl -p err -n20|cat</button>
        <button data-cmd="ps uaxf">ps uaxf</button>
        <button data-cmd="docker ps">docker ps</button>
        <button data-cmd="tmux ls">tmux ls</button>
        <button data-cmd="git status">git status</button>
        <button id="cmd-hide" title="Hide the commands">&#9652;</button>
      </div>
      <!-- What was sent from the composer before. Over the terminal and never
           beside it, for the same reason the answer row is: a list in the flow
           shortens the pane, tmux redraws, and what the page is reading changes
           under it. -->
      <div id="history-list" hidden></div>
      <!-- Where in the output you are, and a way to get anywhere else in it.
           The swipe and the pager both move by a step; neither says how much
           there is or how far through it you are, and crossing a long history
           with either is a lot of steps. The thumb covers the screen's share of
           the whole scrollback, the top of the track is the oldest line kept,
           the bottom is the live end — and a drag to the bottom leaves the
           history the same way a scroll to the end does.
           Inside #term and over it, like the answer row: a bar in the flow would
           narrow the pane, tmux would redraw to the new width, and the page
           would be reading a screen its own scrollbar had reflowed. -->
      <div id="scrollbar" hidden><div id="scroll-thumb"></div></div>
      <!-- The pager and the way back: one stack in the corner a thumb reaches.
           A swipe moves by what a thumb covers, so reading back through a long
           output was a handful of lines and a glide per go.

           ⇞ is on screen always, because it is how you get into the history in
           the first place — a button that appears only once you are already
           there cannot be what took you. The other two are about a screen that
           is somewhere in the history and come and go with it; the stack is
           column-reverse, so ⇞ drops to the bottom of it when it is alone.

           Inside #term rather than over the whole screen, which is where it
           learned to be: a stack pinned 64px above the bottom of the viewport
           was a guess about how tall the bars are, and with ⇞ on screen
           permanently that guess covered the key bar's own ▾ and the composer's
           ▶. The terminal's box ends where the bars begin, whatever they are
           doing.

           Secondary colours on the pager: the way out of the history is the one
           action here that ends something. -->
      <div id="pager">
        <button id="to-bottom" title="Back to the end" hidden>&#8615;</button>
        <button id="page-down" title="A page forward" hidden>&#8671;</button>
        <button id="page-up" title="A page back">&#8670;</button>
      </div>
      <!-- The way into the console pad above, in the corner of the pane opposite
           the one ▴ holds at the bottom of it. Inside #term for the same reason
           the pager is: the terminal's box ends where the bars begin, whatever
           the bars happen to be doing, and a corner measured off the viewport is
           a guess about how tall they are.

           `$` rather than a chevron: a triangle says something opens, this says
           what — a shell prompt is what the buttons behind it are for. It fades
           with the pager and comes back with it, because a 44px circle standing
           permanently over the pane's own first line costs a line to have. -->
      <button id="cmds" title="Console commands">$</button>
    </div>
    <!-- Quick macros for prompt mode. No plain Enter here: the composer's ▶
         sends, and the key bar owns Esc and ^C — one key, one place. -->
    <div id="quickbar" hidden>
      <button data-macro="accept">&#10003; Accept</button>
      <button data-macro="ctrl-c" class="stop">&#9209; ^C</button>
    </div>
    <!-- Selection mode: clipboard exchange for the selected terminal text -->
    <div id="selbar" hidden>
      <button id="copy">&#128203; Copy</button>
      <button id="sel-done">&#10005; Done</button>
    </div>
    <!-- Shown when the browser refuses to hand over the clipboard: the
         system's own Paste writes here, which needs no permission. -->
    <input id="paste-target" type="text" autocomplete="off" placeholder="long-press here → Paste" hidden>
    <!-- Prompt composer (shown in prompt mode instead of the key bar).
         The clock opens what has been sent from here before: a send is not
         guaranteed — the socket can be closed, or open and dead — and until
         this existed a message that did not arrive was gone. Hidden until
         there is something in it. -->
    <form id="composer" hidden>
      <button id="history" type="button" title="Sent before" hidden>&#8635;</button>
      <textarea id="prompt" rows="1" placeholder="Message… (▶ to send)"></textarea>
      <button id="send" type="submit" title="Send">&#9654;</button>
    </form>
    <!-- Two rows, six columns, laid out for a thumb rather than for a
         keyboard: the arrow cross sits in the middle with up above down, the
         two ways out of what the agent is doing hold the left edge, enter the
         right. Shift+Tab is not here; Tab is, since 2026-08-19 — it went away
         on the grounds that this bar answers an agent rather than completing
         filenames, and both halves of that turned out to be wrong: an agent's
         own input completes a path with it, and no on-screen keyboard has a Tab
         at all, which is the one question a key on this bar has to answer. -->
    <div id="keybar">
      <button data-key="esc">Esc</button>
      <button data-key="ctrl-c">^C</button>
      <button data-key="up">&#8593;</button>
      <!-- Ctrl, as a latch: one tap arms it, the next character typed goes as a
           control code, the arm is spent. It took the backspace's key because
           the on-screen keyboard has a backspace of its own and offers no ^R,
           ^D, ^Z or ^L at all — see applyCtrl in js/keys.js. -->
      <button data-mod="ctrl" class="small">Ctrl</button>
      <!-- Over Enter: one sends the message, the other adds a line to it. -->
      <button data-key="alt-enter" class="small">Alt&#9166;</button>
      <!-- ^O — the agent unfolds the output it collapsed. It stood under Esc
           until 2026-08-19 and took ✓ (accept) here: that macro is a right
           arrow with an Enter behind it, and prompt mode's own quick row still
           carries it, while ^O is a byte reachable nowhere else on a phone. -->
      <button data-key="ctrl-o">^O</button>

      <!-- Under Esc, in the corner ^O had: Tab is what an agent's input
           completes a path with and what a shell completes anything with, and
           the on-screen keyboard has no Tab to offer. -->
      <button data-key="tab">Tab</button>
      <button data-key="left">&#8592;</button>
      <button data-key="down">&#8595;</button>
      <button data-key="right">&#8594;</button>
      <button data-key="enter">&#9166;</button>
      <button id="hide" title="Hide the bars">&#9662;</button>
    </div>
    <!-- `multiple`: several screenshots make one message, and on a phone this
         picker is the only path that can carry more than one of them.
         `accept` is set on the way in, by whichever source the clip was asked
         for — see #attach-menu below. -->
    <input id="pick-file" type="file" multiple hidden>
    <!-- The only thing left on screen when everything is hidden. -->
    <button id="show-bars" title="Show the bars" hidden>&#9652;</button>
    <div id="modebar">
      <button id="select" title="Select text">&#9986;</button>
      <!-- Pasting has nothing to do with selecting: it lived inside the
           selection bar, so reaching it meant freezing the screen first. -->
      <button id="paste" title="Paste from the clipboard">&#128229; Paste</button>
      <!-- An Android screenshot is a file, not clipboard content, so the
           only way to attach one is to pick it — and a document has no other
           way in at all. A button rather than a label around the input: the
           bar's buttons are told not to take focus, and on a label that also
           swallowed the click that opens the picker. -->
      <button id="pick" title="Attach a file">&#128206;</button>
      <!-- Four sources, one clip. Which app Android offers is decided by
           `accept` and `capture`, and no single pair asks for all of them: with
           `image/*` the chooser opens on the gallery and a document cannot be
           reached at all, `video/*` opens the same gallery on the films, without
           either the file manager opens and a screenshot is three taps in, and
           `capture` skips the chooser altogether and opens the camera. So the
           clip asks first, and each answer opens the same input with its own
           pair.
           Drawn over the terminal rather than in the flow, like every other
           panel here: a row appearing above the bar would shorten the pane and
           tmux would redraw to the new height. -->
      <div id="attach-menu" hidden>
        <button id="attach-photo" type="button">&#128247; Снять фото</button>
        <button id="attach-image" type="button">&#128444;&#65039; Картинки</button>
        <button id="attach-video" type="button">&#127916; Видео</button>
        <button id="attach-doc" type="button">&#128196; Документы</button>
      </div>
      <button id="mode" title="Prompt mode">&#128172;</button>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
